<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="760" height="390" fill="#ffffff"/>

  <!-- 卡通人物 -->
  <g stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 身体 -->
    <rect x="58" y="150" width="64" height="78" rx="22" fill="#6FA8DC"/>
    <!-- 挥手的手臂 -->
    <path d="M118 165 Q140 150 144 128" fill="none"/>
    <circle cx="145" cy="124" r="6" fill="#FFE0BD"/>
    <path d="M62 168 Q48 190 52 210" fill="none"/>
    <!-- 腿 -->
    <path d="M76 228 L74 256 M104 228 L106 256" fill="none"/>
    <!-- 头 -->
    <circle cx="90" cy="112" r="36" fill="#FFE0BD"/>
    <!-- 头发 -->
    <path d="M56 104 Q60 72 90 72 Q122 72 124 104 Q110 88 92 92 Q74 86 56 104 z" fill="#4A3B2C"/>
    <!-- 眼睛、腮红、笑脸 -->
    <circle cx="78" cy="112" r="3.5" fill="#333" stroke="none"/>
    <circle cx="102" cy="112" r="3.5" fill="#333" stroke="none"/>
    <circle cx="70" cy="124" r="5" fill="#F8B4B4" stroke="none"/>
    <circle cx="110" cy="124" r="5" fill="#F8B4B4" stroke="none"/>
    <path d="M80 126 Q90 136 100 126" fill="none"/>
  </g>
  <text x="90" y="282" text-anchor="middle" font-size="15" fill="#333">同一个人</text>

  <!-- 全部经历卡片 -->
  <rect x="170" y="70" width="150" height="196" rx="14" fill="#FFF8E1" stroke="#F0B429" stroke-width="2.5"/>
  <text x="245" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#8A5A00">全部经历</text>
  <g font-size="14" fill="#333">
    <text x="190" y="130">· 项目经验</text>
    <text x="190" y="158">· 带团队经历</text>
    <text x="190" y="186">· 毕业院校</text>
    <text x="190" y="214">· 摄影爱好</text>
    <text x="190" y="242">· 驾照</text>
  </g>
  <text x="245" y="290" text-anchor="middle" font-size="13" fill="#888">相当于原始向量</text>

  <!-- 箭头 -->
  <path d="M326 130 Q390 90 466 92" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M326 210 Q390 250 466 258" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="395" y="84" text-anchor="middle" font-size="13" fill="#1E5FA8">矩阵 A</text>
  <text x="395" y="100" text-anchor="middle" font-size="12" fill="#1E5FA8">技术岗风格</text>
  <text x="395" y="270" text-anchor="middle" font-size="13" fill="#2E7D32">矩阵 B</text>
  <text x="395" y="286" text-anchor="middle" font-size="12" fill="#2E7D32">管理岗风格</text>

  <!-- 技术岗简历 -->
  <rect x="478" y="26" width="250" height="136" rx="14" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2.5"/>
  <text x="498" y="56" font-size="16" font-weight="bold" fill="#1E5FA8">简历 · 技术岗版</text>
  <circle cx="700" cy="50" r="12" fill="#FFE0BD" stroke="#333" stroke-width="2"/>
  <path d="M694 54 Q700 59 706 54" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
  <text x="498" y="90" font-size="16" font-weight="bold" fill="#333">★ 项目经验</text>
  <text x="498" y="116" font-size="14" fill="#333">· 毕业院校</text>
  <text x="498" y="144" font-size="12" fill="#999">（带团队、摄影、驾照已略去）</text>

  <!-- 管理岗简历 -->
  <rect x="478" y="196" width="250" height="136" rx="14" fill="#E8F5E9" stroke="#43A047" stroke-width="2.5"/>
  <text x="498" y="226" font-size="16" font-weight="bold" fill="#2E7D32">简历 · 管理岗版</text>
  <circle cx="700" cy="220" r="12" fill="#FFE0BD" stroke="#333" stroke-width="2"/>
  <path d="M694 224 Q700 229 706 224" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
  <text x="498" y="260" font-size="16" font-weight="bold" fill="#333">★ 带团队经历</text>
  <text x="498" y="286" font-size="14" fill="#333">· 项目经验</text>
  <text x="498" y="314" font-size="12" fill="#999">（院校、摄影、驾照已略去）</text>

  <!-- 底部说明 -->
  <text x="380" y="370" text-anchor="middle" font-size="15" fill="#333">换一张矩阵 = 换一种风格，重写同一份描述</text>
</svg>
